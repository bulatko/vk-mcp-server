<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VK card</title>
    <style>
      /*
       * The host hands its own palette down as CSS variables; these are the
       * fallbacks for a host that sends none, and they follow the system
       * theme rather than assuming light.
       */
      :root {
        color-scheme: light dark;
        --vk-fg: light-dark(#0d0d0d, #f2f2f2);
        --vk-muted: light-dark(#6a6f73, #9aa0a6);
        --vk-bg: light-dark(#ffffff, #1a1a1a);
        --vk-card: light-dark(#f6f7f8, #242424);
        --vk-line: light-dark(#e3e5e8, #333333);
        --vk-accent: #07f;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 12px;
        font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--vk-fg);
        background: var(--vk-bg);
      }

      .head {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 12px;
      }
      .head h1 { font-size: 15px; margin: 0; font-weight: 600; }
      .head .count { color: var(--vk-muted); font-size: 13px; }

      .post {
        background: var(--vk-card);
        border: 1px solid var(--vk-line);
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 10px;
      }

      .post .when { color: var(--vk-muted); font-size: 12px; margin-bottom: 6px; }
      .post .text { white-space: pre-wrap; overflow-wrap: anywhere; }
      /* Long posts are the norm on VK; clamp so the card stays scannable. */
      .post .text.clamped {
        display: -webkit-box;
        -webkit-line-clamp: 6;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .post .more {
        background: none;
        border: 0;
        padding: 4px 0 0;
        color: var(--vk-accent);
        font: inherit;
        cursor: pointer;
      }

      .photos {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 6px;
        margin-top: 10px;
      }
      .photos .frame { position: relative; }
      .photos img {
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        border-radius: 6px;
        display: block;
      }
      /*
       * Most posts carry exactly one picture, and cropping it into a thumbnail
       * grid cell wastes the card: a vertical clip loses its top and bottom to
       * a 4:3 box. Alone, it gets the width and keeps its own proportions.
       */
      .photos.single {
        display: block;
        text-align: center;
      }
      .photos.single img {
        width: auto;
        max-width: 100%;
        max-height: 340px;
        aspect-ratio: auto;
        object-fit: contain;
      }
      /*
       * Inline-block so the frame hugs the picture: stretched to the row width
       * it would park the duration badge in the empty space beside a vertical
       * clip rather than on it.
       */
      .photos.single .frame {
        display: inline-block;
      }
      /* Videos are indistinguishable from stills without it. */
      .photos .play {
        position: absolute;
        right: 6px;
        bottom: 6px;
        padding: 1px 6px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.65);
        color: #fff;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }

      .stats {
        display: flex;
        gap: 14px;
        margin-top: 10px;
        color: var(--vk-muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      .empty { color: var(--vk-muted); padding: 24px 0; text-align: center; }

      /* Communities and profiles: a banner, an avatar over it, then the facts. */
      .entity { overflow: hidden; }
      .entity .cover {
        margin: -12px -12px 0;
        aspect-ratio: 32 / 9;
        object-fit: cover;
        width: calc(100% + 24px);
        display: block;
      }
      .entity .head-row {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      /* Pulled up over the banner when there is one, flush when there is not. */
      .entity .cover ~ .head-row { margin-top: -28px; }
      .entity .avatar {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        object-fit: cover;
        flex: none;
        border: 2px solid var(--vk-card);
        background: var(--vk-card);
      }
      .entity .who { min-width: 0; }
      /* Only when a banner is present does the row need clearing for it. */
      .entity .cover ~ .head-row .who { padding-top: 28px; }
      .entity .name {
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      /* A checkmark that survives a host with no emoji font. */
      .entity .tick {
        color: var(--vk-accent);
        font-size: 12px;
        border: 1px solid currentColor;
        border-radius: 50%;
        width: 14px;
        height: 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        flex: none;
      }
      .entity .sub { color: var(--vk-muted); font-size: 12px; }
      .entity .facts {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        margin-top: 10px;
        color: var(--vk-muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .entity .about { margin-top: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }

      .more-pages {
        color: var(--vk-muted);
        font-size: 12px;
        text-align: center;
        padding: 4px 0 8px;
      }
    </style>
  </head>
  <body>
    <div class="head">
      <h1 id="title">VK wall</h1>
      <span class="count" id="count"></span>
    </div>
    <div id="posts"></div>
    <div class="more-pages" id="pages"></div>

    <script>
      // The MCP Apps handshake is small enough to speak directly: the App class
      // from @modelcontextprotocol/ext-apps is a convenience wrapper, and taking
      // it would mean a bundler in a project that has never needed one.
      const PROTOCOL_VERSION = '2026-01-26';
      const host = window.parent;
      let nextId = 1;

      function send(message) {
        host.postMessage({ jsonrpc: '2.0', ...message }, '*');
      }

      function request(method, params) {
        const id = nextId++;
        send({ id, method, params });
        return id;
      }

      const fmt = new Intl.NumberFormat();
      const el = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      };

      function when(unixSeconds) {
        const date = new Date(unixSeconds * 1000);
        return date.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
      }

      // The card is never wider than a chat column, so the 2560px original is
      // megabytes spent to be scaled down. Take the smallest size that still
      // covers a retina render, and fall back to the largest there is.
      const ENOUGH = 1024;
      function bestSize(sizes) {
        if (!Array.isArray(sizes) || !sizes.length) return null;
        const sufficient = sizes.filter((s) => s.width >= ENOUGH);
        const chosen = sufficient.length
          ? sufficient.reduce((best, s) => (s.width < best.width ? s : best))
          : sizes.reduce((best, s) => (s.width > best.width ? s : best));
        return chosen?.url ?? null;
      }

      /**
       * A wall post carries a photo, a video, or neither. Videos matter as much
       * as photos here — clips are often the whole post, and skipping them left
       * those cards showing a date and nothing else.
       */
      function previewOf(attachment) {
        if (attachment.type === 'photo') {
          const url = bestSize(attachment.photo?.sizes);
          return url ? { url, label: null } : null;
        }
        if (attachment.type === 'video') {
          const url = bestSize(attachment.video?.image);
          if (!url) return null;
          const seconds = attachment.video?.duration;
          const label = typeof seconds === 'number'
            ? `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`
            : '▶';
          return { url, label };
        }
        return null;
      }

      function renderPost(post) {
        const card = el('div', 'post');
        card.append(el('div', 'when', when(post.date)));

        if (post.text) {
          const text = el('div', 'text', post.text);
          // 400 characters is roughly where the clamp starts hiding something.
          if (post.text.length > 400) {
            text.classList.add('clamped');
            const more = el('button', 'more', 'Show more');
            more.addEventListener('click', () => {
              text.classList.remove('clamped');
              more.remove();
            });
            card.append(text, more);
          } else {
            card.append(text);
          }
        }

        const previews = (post.attachments || []).map(previewOf).filter(Boolean);

        if (previews.length) {
          const grid = el('div', previews.length === 1 ? 'photos single' : 'photos');
          for (const preview of previews) {
            const frame = el('div', 'frame');
            const img = el('img');
            img.src = preview.url;
            img.loading = 'lazy';
            img.alt = '';
            // VK's CDN links expire, and a host may refuse the origin outright.
            // A broken image leaves a hole the size of the picture; drop the
            // frame instead, and the grid closes over it.
            img.addEventListener('error', () => {
              frame.remove();
              if (!grid.childElementCount) grid.remove();
            });
            frame.append(img);
            if (preview.label) frame.append(el('span', 'play', preview.label));
            grid.append(frame);
          }
          card.append(grid);
        }

        const stats = el('div', 'stats');
        // Words rather than emoji: a host without an emoji font renders those
        // as empty boxes, and there is no way to know in advance which it has.
        const add = (label, value) => {
          if (typeof value !== 'number') return;
          stats.append(el('span', null, `${fmt.format(value)} ${value === 1 ? label : label + 's'}`));
        };
        add('view', post.views?.count);
        add('like', post.likes?.count);
        add('repost', post.reposts?.count);
        add('comment', post.comments?.count);
        if (stats.childElementCount) card.append(stats);

        return card;
      }

      /** Adds a fact only when VK actually returned it — profiles vary wildly. */
      function facts(pairs) {
        const row = el('div', 'facts');
        for (const [label, value] of pairs) {
          if (value === undefined || value === null || value === '') continue;
          row.append(el('span', null, typeof value === 'number' ? `${fmt.format(value)} ${label}` : value));
        }
        return row.childElementCount ? row : null;
      }

      function avatarFrom(url) {
        if (!url) return null;
        const img = el('img', 'avatar');
        img.src = url;
        img.alt = '';
        img.addEventListener('error', () => img.remove());
        return img;
      }

      function coverInto(card, url) {
        if (!url) return;
        const img = el('img', 'cover');
        img.src = url;
        img.alt = '';
        img.addEventListener('error', () => img.remove());
        card.append(img);
      }

      function nameLine(text, verified) {
        const line = el('div', 'name', text);
        // 1 means VK verified the account; anything else is an ordinary one.
        if (verified === 1) {
          const tick = el('span', 'tick', '✓');
          tick.title = 'Verified by VK';
          line.append(tick);
        }
        return line;
      }

      function renderCommunity(group) {
        const card = el('div', 'post entity');
        coverInto(card, bestSize(group.cover?.images));

        const row = el('div', 'head-row');
        const avatar = avatarFrom(group.photo_200 || group.photo_100);
        if (avatar) row.append(avatar);

        const who = el('div', 'who');
        who.append(nameLine(group.name || `Community ${group.id}`, group.verified));
        const handle = group.screen_name ? `@${group.screen_name}` : `id ${group.id}`;
        who.append(el('div', 'sub', group.activity ? `${handle} · ${group.activity}` : handle));
        row.append(who);
        card.append(row);

        const row2 = facts([
          ['members', group.members_count],
          [null, group.status],
          [null, group.site],
        ].map(([l, v]) => [l ?? '', v]));
        if (row2) card.append(row2);

        if (group.description) {
          const about = el('div', 'about text', group.description);
          if (group.description.length > 400) {
            about.classList.add('clamped');
            const more = el('button', 'more', 'Show more');
            more.addEventListener('click', () => {
              about.classList.remove('clamped');
              more.remove();
            });
            card.append(about, more);
          } else {
            card.append(about);
          }
        }

        return card;
      }

      function renderProfile(user) {
        const card = el('div', 'post entity');

        const row = el('div', 'head-row');
        const avatar = avatarFrom(user.photo_200 || user.photo_100);
        if (avatar) row.append(avatar);

        const who = el('div', 'who');
        who.append(nameLine(`${user.first_name ?? ''} ${user.last_name ?? ''}`.trim() || `id ${user.id}`, user.verified));

        const place = [user.city?.title, user.country?.title].filter(Boolean).join(', ');
        const handle = user.screen_name ? `@${user.screen_name}` : `id ${user.id}`;
        who.append(el('div', 'sub', place ? `${handle} · ${place}` : handle));
        row.append(who);
        card.append(row);

        // A deactivated or private profile returns almost nothing; say which,
        // instead of drawing an empty card.
        if (user.deactivated) {
          card.append(el('div', 'about', `This profile is ${user.deactivated}.`));
          return card;
        }

        const row2 = facts([
          ['followers', user.followers_count],
          ['friends', user.counters?.friends],
          [null, user.occupation?.name],
          [null, user.online === 1 ? 'online' : null],
        ].map(([l, v]) => [l ?? '', v]));
        if (row2) card.append(row2);

        if (user.status) card.append(el('div', 'about', user.status));
        if (user.is_closed && !user.can_access_closed) {
          card.append(el('div', 'sub', 'Private profile — most fields are hidden from this token.'));
        }

        return card;
      }

      /**
       * One resource serves every tool that has a card, so it works out what it
       * was handed. VK's shapes are distinct enough to tell apart: communities
       * come under `groups`, posts carry a date, profiles carry a first name.
       */
      function render(result) {
        const data = result?.structuredContent;
        const list = document.getElementById('posts');
        const countEl = document.getElementById('count');
        const pagesEl = document.getElementById('pages');
        list.replaceChildren();
        countEl.textContent = '';
        pagesEl.textContent = '';

        const groups = Array.isArray(data?.groups) ? data.groups : null;
        const items = Array.isArray(data?.items) ? data.items : [];

        if (groups) {
          document.getElementById('title').textContent = groups.length === 1 ? 'VK community' : 'VK communities';
          if (!groups.length) return list.append(el('div', 'empty', 'No communities came back.'));
          for (const group of groups) list.append(renderCommunity(group));
          return;
        }

        if (items.length && items[0].first_name !== undefined) {
          document.getElementById('title').textContent = items.length === 1 ? 'VK profile' : 'VK profiles';
          for (const user of items) list.append(renderProfile(user));
          return;
        }

        document.getElementById('title').textContent = 'VK wall';
        if (!items.length) return list.append(el('div', 'empty', 'Nothing came back.'));

        countEl.textContent = typeof data.count === 'number' ? `${fmt.format(data.count)} posts` : '';
        for (const post of items) list.append(renderPost(post));

        const next = data.pagination?.next_offset;
        pagesEl.textContent =
          typeof next === 'number' ? `Showing ${items.length} — ask for more from offset ${next}` : '';
      }

      window.addEventListener('message', (event) => {
        if (event.source !== host) return;
        const message = event.data;
        if (!message || message.jsonrpc !== '2.0') return;

        if (message.method === 'ui/notifications/tool-result') {
          render(message.params);
        }
      });

      // Handshake: initialize, then announce we are ready for notifications.
      request('ui/initialize', {
        appInfo: { name: 'VK card', version: '1.0.0' },
        appCapabilities: {},
        protocolVersion: PROTOCOL_VERSION,
      });

      window.addEventListener('message', function onInit(event) {
        if (event.source !== host) return;
        const message = event.data;
        if (message?.id === 1 && message?.result) {
          send({ method: 'ui/notifications/initialized' });
          window.removeEventListener('message', onInit);
        }
      });
    </script>
  </body>
</html>
