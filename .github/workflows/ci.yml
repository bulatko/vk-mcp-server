name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: node --check src/index.js

  # Glama and the Docker MCP Catalog build the server from this Dockerfile, so
  # a base image the code has outgrown breaks the listing without a single test
  # failing — which is how 0.7.0 shipped on node:18. Build it and speak MCP to it.
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t vk-mcp-server:ci .

      - name: Answer initialize and list the tools
        run: |
          OUT=$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | timeout 30 docker run -i --rm vk-mcp-server:ci)
          echo "$OUT" | head -c 400; echo
          echo "$OUT" | grep -q '"serverInfo"' || { echo "::error::no initialize answer"; exit 1; }
          echo "$OUT" | grep -q '"vk_messages_send"' || { echo "::error::tools/list incomplete"; exit 1; }
